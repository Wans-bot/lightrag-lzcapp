name: push-image
on: {workflow_dispatch: null}
jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - run: |
          docker pull ghcr.io/hkuds/lightrag:latest
          docker tag ghcr.io/hkuds/lightrag:latest ttl.sh/wans-lightrag-1.5.7:24h
          docker push ttl.sh/wans-lightrag-1.5.7:24h
